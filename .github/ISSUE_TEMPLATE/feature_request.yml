name: Feature request
description: Propose a change or an addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Backpocket makes hard or impossible? Describe the workflow, not the feature.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead. Concrete beats complete.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use today.

  - type: dropdown
    id: willing-to-pr
    attributes:
      label: Willing to open a PR?
      description: See CONTRIBUTING.md first. "No" is a fine answer.
      options:
        - "Yes"
        - Yes, with guidance
        - "No"
    validations:
      required: true
