# Shapes the notes produced by generate_release_notes in release.yml.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Localization
      labels:
        - localization
    - title: Other
      labels:
        - "*"
