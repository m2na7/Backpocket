# Shapes the notes GitHub drafts when a release is written by hand in the web
# UI and "Generate release notes" is pressed. Neither release path uses them:
# scripts/release.sh and .github/workflows/release.yml both take the body from
# CHANGELOG.md.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Localization
      labels:
        - localization
    - title: Other
      labels:
        - "*"
